name: ktc

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # SSH 터널을 통한 DB 관리용. EC2 외부에는 직접 노출하지 않는다.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 768m

  backend:
    # 로컬은 기존 빌드 이미지를, CD는 GHCR의 고정 digest를 사용한다.
    image: ${BACKEND_IMAGE:-ktc-backend}
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:?KAKAO_CLIENT_ID is required}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:?KAKAO_CLIENT_SECRET is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-${PUBLIC_ORIGIN:-http://localhost}}
      AUTH_SUCCESS_REDIRECT: ${PUBLIC_ORIGIN:-http://localhost}/oauth/success
      AUTH_FAILURE_REDIRECT: ${PUBLIC_ORIGIN:-http://localhost}/login
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      # 실제 배포(EC2/ECS)에서는 IAM Role로 자동 인증되어 비워둬도 됨.
      # 로컬에서 docker compose로 띄워 테스트할 때만 호스트 셸의 AWS 자격증명을 전달.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      RAW_STORAGE_S3_BUCKET: ${RAW_STORAGE_S3_BUCKET:?RAW_STORAGE_S3_BUCKET is required}
      # 매칭 워커가 호출할 AI 주소. 같은 compose 네트워크의 서비스 이름 ai 로 붙는다.
      AI_BASE_URL: ${AI_BASE_URL:-http://ai:8000}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m
    ports:
      # 배포 상태 검사와 로컬 개발용. 외부 API·Swagger는 Caddy로 접근한다.
      - "127.0.0.1:8080:8080"
    mem_limit: 768m
    
  ai:
    # 로컬은 기존 빌드 이미지를, CD는 GHCR의 고정 digest를 사용한다.
    image: ${AI_IMAGE:-ktc-ai}
    build:
      context: ../../AI
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../../AI/.env
    volumes:
      - ../../AI/evals:/app/evals
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 512m

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        # VITE_* 는 빌드 시점에 번들에 박힌다. 바꾸면 이미지를 다시 빌드해야 한다.
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL-}
        VITE_USE_MOCK: ${USE_MOCK:-true}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 128m

  caddy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    volumes:
      - ../caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
    ports:
      - "80:80"
      - "443:443"
    mem_limit: 128m

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
