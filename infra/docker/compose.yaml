name: ktc

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 768m

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 768m
    
  ai:
    build:
      context: ../../AI
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../../AI/.env
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 512m

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* 는 빌드 시점에 번들에 박힌다. 바꾸면 이미지를 다시 만들어야 한다.
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8080}
        NEXT_PUBLIC_USE_MOCK: ${USE_MOCK:-true}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # 서버 컴포넌트에서 백엔드를 부를 때 쓰는 내부 주소
      API_BASE_URL: http://backend:8080
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 512m

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # 외부에 열리는 유일한 포트. 나머지 서비스는 127.0.0.1 에만 바인드한다.
      - "80:80"
    mem_limit: 128m

volumes:
  postgres_data:
