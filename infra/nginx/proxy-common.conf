# 모든 location 에서 include 해야 하는 공통 프록시 헤더.
#
# ⚠️ nginx 의 `proxy_set_header` 는 레벨 간에 병합되지 않는다.
#    location 안에 하나라도 쓰면 server 레벨의 것들이 전부 무시되고,
#    Host 는 기본값 $proxy_host(= upstream 이름) 로 넘어간다.
#    그러면 Next.js 서버 액션이 origin 불일치로 500 을 낸다.
#    그래서 server 레벨에 두지 않고 이 파일을 각 location 에서 include 한다.
#
# 컨테이너에는 /etc/nginx/proxy-common.inc 로 마운트한다.
# conf.d/ 안에 .conf 로 두면 nginx 기본 설정의 `include conf.d/*.conf` 에
# 걸려 http 레벨에도 중복 로드된다.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
