# 잇다 리버스 프록시
#
# 80 번으로 받아서
#   /      → frontend:3000  (Next.js)
#   /api/  → backend:8080   (Spring Boot)
# 로 넘긴다. frontend·backend·ai 컨테이너는 외부에 직접 열지 않는다.
#
# HTTPS 는 도메인이 정해진 뒤 certbot 으로 붙인다 (443 server 블록 추가).

upstream itda_frontend {
    server frontend:3000;
}

upstream itda_backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    # 기관이 올리는 사진·일지 원본. 기본 1m 이면 사진 한 장에도 413 이 난다.
    client_max_body_size 25m;

    # 프록시 뒤에 있다는 것을 백엔드가 알아야 한다 (리다이렉트 URL·로그 IP)
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    location /api/ {
        proxy_pass http://itda_backend;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://itda_frontend;

        # Next.js dev HMR / 향후 스트리밍 대비
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Next.js 정적 자산은 파일명에 해시가 들어가므로 길게 캐시해도 안전하다
    location /_next/static/ {
        proxy_pass http://itda_frontend;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
