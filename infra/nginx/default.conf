# 잇다 리버스 프록시
#
# 80 번으로 받아서
#   /      → frontend:3000  (Next.js)
#   /api/  → backend:8080   (Spring Boot)
# 로 넘긴다. frontend·backend·ai 컨테이너는 외부에 직접 열지 않는다.
#
# HTTPS 는 도메인이 정해진 뒤 certbot 으로 붙인다 (443 server 블록 추가).

# 웹소켓 요청일 때만 Connection: upgrade 를 보낸다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream itda_frontend {
    server frontend:3000;
}

upstream itda_backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    # 기관이 올리는 사진·일지 원본. 기본 1m 이면 사진 한 장에도 413 이 난다.
    client_max_body_size 25m;

    location /api/ {
        include /etc/nginx/proxy-common.inc;
        proxy_pass http://itda_backend;
        proxy_read_timeout 120s;
    }

    # Next.js 정적 자산은 파일명에 해시가 들어가므로 길게 캐시해도 안전하다
    location /_next/static/ {
        include /etc/nginx/proxy-common.inc;
        proxy_pass http://itda_frontend;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        include /etc/nginx/proxy-common.inc;
        proxy_pass http://itda_frontend;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
