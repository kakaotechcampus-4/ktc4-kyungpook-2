spring:
  datasource:
    url: jdbc:h2:mem:backend;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: test-client-id
            client-secret: test-client-secret
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope: profile_nickname
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

app:
  cors:
    allowed-origins: http://localhost:3000
  # 테스트 중에 워커가 실제 AI 를 부르지 않도록 끈다.
  matching:
    worker:
      enabled: false
  validation:
    worker:
      enabled: false
  summary:
    worker:
      enabled: false
    # 요청 기반(#181) 테스트를 그대로 두려고 끈다. 켜진 동작은 테스트가 설정을 직접 넘겨 본다.
    auto-run: false
  insight:
    worker:
      enabled: false
  # H2 단위 테스트는 한 프로세스 안 잠금, PostgreSQL 통합 테스트는 advisory lock 을 auto 가 고른다.
  withdrawal:
    enabled: true
    wait-for-completion: 2s
    kakao:
      admin-key: test-admin-key
      app-id: "123456"
    worker:
      enabled: false

jwt:
  secret: test-secret-key-for-unit-tests-only
