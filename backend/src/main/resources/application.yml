spring:
  application:
    name: backend
  config:
    import: optional:application-secret.yml
  task:
    scheduling:
      pool:
        size: 7
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  port: 8080
  forward-headers-strategy: framework

app:
  raw-storage:
    base-dir: ${RAW_STORAGE_DIR:./data/raw-storage}
  raw-record:
    limits:
      max-entries-per-file: ${RAW_RECORD_MAX_ENTRIES_PER_FILE:500}
    upload:
      max-concurrent: ${RAW_RECORD_UPLOAD_MAX_CONCURRENT:2}
      max-waiting: ${RAW_RECORD_UPLOAD_MAX_WAITING:4}
      max-wait: 10s
    direct-upload:
      url-ttl: 10m
      abandon-after: 1d
      sweeper:
        enabled: ${UPLOAD_SWEEPER_ENABLED:true}
        cron: "0 30 4 * * *"
  agent-queue:
    max-awaiting-entries: ${AGENT_QUEUE_MAX_AWAITING_ENTRIES:1000}
  auth:
    cookie:
      secure: ${AUTH_COOKIE_SECURE:false}
    success-redirect: ${AUTH_SUCCESS_REDIRECT:http://localhost:3000/oauth/success}
    failure-redirect: ${AUTH_FAILURE_REDIRECT:http://localhost:3000/login}
    dev-login:
      enabled: ${DEV_LOGIN_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  withdrawal:
    enabled: ${WITHDRAWAL_ENABLED:false}
    wait-for-completion: 4s
    lock: auto
    kakao:
      base-url: https://kapi.kakao.com
      admin-key: ${KAKAO_ADMIN_KEY:}
      app-id: ${KAKAO_APP_ID:}
      connect-timeout: 2s
      read-timeout: 3s
    worker:
      enabled: ${WITHDRAWAL_WORKER_ENABLED:true}
      delay-ms: 60000
  ai:
    base-url: ${AI_BASE_URL:http://localhost:8000}
    connect-timeout: 3s
    read-timeout: 70s
    retry-backoffs: 2s,5s
    agent-down:
      max-releases: 2
      pause: 30s
  ai-progress:
    enabled: ${AI_PROGRESS_ENABLED:false}
    interval: 1s
    timeout: 500ms
  matching:
    worker:
      enabled: ${MATCHING_WORKER_ENABLED:true}
      delay-ms: 5000
      batch-size: 10
  validation:
    worker:
      enabled: ${VALIDATION_WORKER_ENABLED:true}
      delay-ms: 5000
      batch-size: 10
  summary:
    worker:
      enabled: ${SUMMARY_WORKER_ENABLED:true}
      delay-ms: 5000
      batch-size: 10
    auto-run: ${SUMMARY_AUTO_RUN:true}
    read-timeout: 120s
  notify:
    worker:
      enabled: ${NOTIFY_WORKER_ENABLED:true}
      delay-ms: 5000
      batch-size: 10
    failure-backoffs: 1m,5m,30m
    read-timeout: 90s
    timeout-retries: 0
  insight:
    worker:
      enabled: ${INSIGHT_WORKER_ENABLED:true}
      delay-ms: 5000
      batch-size: 10
    period-days: 7
    zone: Asia/Seoul
    lookback-days: 14
    include-current-week: ${INSIGHT_INCLUDE_CURRENT_WEEK:false}
    failure-backoffs: 1m,5m,30m
    read-timeout: 210s
    timeout-retries: 1
  purge:
    worker:
      enabled: ${PURGE_WORKER_ENABLED:true}
      cron: "0 0 4 * * *"

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 10800000
  max-session-ms: 43200000
