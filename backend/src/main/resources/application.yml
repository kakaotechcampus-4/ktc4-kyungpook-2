spring:
  application:
    name: backend
  config:
    import: optional:application-secret.yml
  task:
    scheduling:
      pool:
        # 에이전트 워커(매칭·검증, 요약은 #91 예정) 하나에 스레드 하나. 기본값 1이면 워커들이 번갈아 돌아 단계별 속도가 나뉜다.
        # 워커 수만큼 AI 를 동시에 부르므로 AI 동시 호출 한도(8)를 넘지 않게 둔다.
        size: 3
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  security:
    oauth2:
      client:
        # 이 블록이 예전의 KakaoAuthService(토큰 교환 + 사용자 조회)를 대체한다.
        # provider 를 추가하려면 registration/provider 에 블록만 더 넣으면 된다.
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            # {baseUrl} 은 실제 요청 주소로 치환된다. 이 주소가 카카오 콘솔의
            # Redirect URI 와 글자까지 같아야 한다 (다르면 KOE006).
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            # 카카오는 client_secret 을 헤더가 아니라 폼 파라미터로 받는다.
            client-authentication-method: client_secret_post
            scope: profile_nickname
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            # 사용자 정보 응답에서 식별자로 쓸 최상위 필드.
            # OAuth2LoginSuccessHandler 가 이 값을 JWT subject 로 넣는다.
            user-name-attribute: id

server:
  port: 8080
  # Caddy 뒤에 있을 때 X-Forwarded-* 를 신뢰한다. 기본값(NONE)이면 Spring 이 이 헤더를
  # 무시해서, redirect-uri 의 {baseUrl} 이 내부 주소나 잘못된 scheme 으로 만들어진다.
  # 특히 HTTPS 를 붙이면 http:// 로 조립돼 카카오가 KOE006 으로 거절한다.
  forward-headers-strategy: framework

app:
  raw-storage:
    base-dir: ${RAW_STORAGE_DIR:./data/raw-storage}
  auth:
    cookie:
      # 로컬 HTTP는 false, 운영 HTTPS는 true로 설정한다.
      # true 인데 HTTPS 가 아니면 브라우저가 쿠키를 보내지 않아 로그인이 전부 실패한다.
      secure: ${AUTH_COOKIE_SECURE:false}
    # 로그인이 끝난 뒤 사용자를 돌려보낼 프론트 주소.
    success-redirect: ${AUTH_SUCCESS_REDIRECT:http://localhost:3000/oauth/success}
    failure-redirect: ${AUTH_FAILURE_REDIRECT:http://localhost:3000/login}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  ai:
    # AI 서버 주소 (매칭·검증 에이전트 공통). compose 에서는 서비스 이름으로 http://ai:8000 을 넘긴다.
    base-url: ${AI_BASE_URL:http://localhost:8000}
    connect-timeout: 3s
    # AI 가 LLM 응답을 60초(AI/matching/config.py, AI/validation/config.py LUNA_TIMEOUT)까지 기다린다.
    # 이보다 짧으면 느린 정상 응답을 BE 가 먼저 끊고 재시도해서 LLM 을 여러 번 부르게 된다. AI 처리 시간까지 여유를 둔다.
    read-timeout: 70s
    # 재시도 전에 쉬는 시간. 개수가 재시도 횟수다 (최초 1회 + 2회).
    retry-backoffs: 2s,5s
  matching:
    worker:
      enabled: ${MATCHING_WORKER_ENABLED:true}
      delay-ms: 5000
      batch-size: 10
  validation:
    worker:
      enabled: ${VALIDATION_WORKER_ENABLED:true}
      delay-ms: 5000
      batch-size: 10
  summary:
    worker:
      enabled: ${SUMMARY_WORKER_ENABLED:true}
      delay-ms: 5000
      # 요약은 일지가 아니라 묶음(아동·날짜·기관) 단위로 집는다.
      batch-size: 10
    # entry_date 다음 날 이 시각이 지나야 그 날짜를 요약한다 (AI/summary/CRITERIA.md §5). 임의값이라 설정으로 둔다.
    cutoff-time: "03:00"
    # 묶음의 마지막 일지가 들어온 뒤 이만큼 더 기다린다. 마감이 지난 날짜의 일지를 연달아 올리는 경우를 한 번에 묶는다.
    debounce: 30m
    zone: Asia/Seoul
    # 요약은 AI 가 LLM 을 90초(AI/summary/config.py LUNA_TIMEOUT)까지 기다린다. app.ai.read-timeout(70초)으로는
    # 느린 정상 응답을 먼저 끊고 다시 불러서 LLM 을 여러 번 부르게 된다.
    read-timeout: 120s

jwt:
  # 로컬은 application-secret.yml 이 덮어쓰고, 배포는 이 환경변수로 넣는다.
  # 기본값을 두지 않는다 — 값이 없거나 32바이트보다 짧으면 기동 단계에서 바로 실패한다.
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 3600000 # 1시간 / 출입증 쿠키 만료도 이 값을 따른다
