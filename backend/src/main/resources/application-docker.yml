spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    # Flyway 이전에 ddl-auto: update 로 만든 DB 는 기록 테이블이 없다. 그런 DB 는 V1 까지 적용된 것으로 표시만 한다.
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      # 스키마는 Flyway 만 바꾼다. 엔티티와 테이블이 다르면 앱이 뜨지 않는다.
      ddl-auto: validate

app:
  raw-storage:
    s3:
      bucket: ${RAW_STORAGE_S3_BUCKET}
      region: ${AWS_REGION:ap-northeast-2}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  auth:
    success-redirect: ${AUTH_SUCCESS_REDIRECT}
    failure-redirect: ${AUTH_FAILURE_REDIRECT}
