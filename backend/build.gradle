plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.itda'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.9.1'
	implementation platform('software.amazon.awssdk:bom:2.54.14')
	implementation 'software.amazon.awssdk:s3'
	// AI 서버 호출 클라이언트. 503·429 자동 재시도를 끄려고 직접 설정한다 (AiAgentClientConfig, #153).
	// 버전은 이 선언 전부터 Spring Boot 의존성 관리가 정한 값(5.5)을 따른다. AWS SDK apache5-client 는 5.6 을 원해 낮춰져 있다
	implementation 'org.apache.httpcomponents.client5:httpclient5'
	// 업로드한 일지에서 텍스트를 뽑는다 — docx 는 POI, pdf 는 PDFBox (RawTextExtractor, #383)
	implementation 'org.apache.poi:poi-ooxml:5.4.1'
	implementation 'org.apache.pdfbox:pdfbox:3.0.5'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation enforcedPlatform('org.testcontainers:testcontainers-bom:2.0.5')
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

configurations.configureEach {
	resolutionStrategy.eachDependency { details ->
		if (details.requested.group == 'org.testcontainers' && details.requested.name == 'testcontainers') {
			details.useVersion '2.0.5'
		}
	}
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'integration'
	}
}

tasks.register('integrationTest', Test) {
	description = 'Runs Testcontainers-based integration tests.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	shouldRunAfter(tasks.named('test'))

	useJUnitPlatform {
		includeTags 'integration'
	}
}

// 개발자별 로컬·비밀 설정은 jar 에 넣지 않는다 — .gitignore 와 같은 목록 (#193).
// 넣으면 로컬에서 만든 jar·Docker 이미지에 비밀값이 들어가고 환경변수 대신 그 값이 쓰인다.
// bootRun·IntelliJ 실행·테스트는 jar 가 아니라 resources 폴더를 읽어서 영향이 없다.
tasks.withType(Jar).configureEach {
	exclude(
		'**/application-local.yml', '**/application-local.yaml', '**/application-local.properties',
		'**/application-secret.yml', '**/application-secret.yaml', '**/application-secret.properties',
		'**/application-*-local.yml', '**/application-*-local.yaml', '**/application-*-local.properties',
		'**/application-*-secret.yml', '**/application-*-secret.yaml', '**/application-*-secret.properties'
	)
}
