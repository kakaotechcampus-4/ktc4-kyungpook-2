name: AI CI/CD

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/kakaotechcampus-4/ktc4-kyungpook-2-ai

jobs:
  changes:
    name: Check AI deployment baseline
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare with last successful AI deployment
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 infra/scripts/deployment-record.py detect --service ai --commit "$GITHUB_SHA"

  test:
    name: AI tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify deployment scripts
        run: |
          bash -n infra/scripts/deploy-ai.sh
          bash -n infra/scripts/deploy-backend.sh
          bash -n infra/scripts/deploy-common.sh
          python3 -m unittest discover -s infra/scripts/tests -p 'test_*.py' -v
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            AI/requirements.txt
            AI/requirements-dev.txt
      - name: Install and verify dependencies
        working-directory: AI
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Test without external model calls
        working-directory: AI
        run: python -m pytest tests --junitxml=build/test-results/pytest.xml -v
      - name: Build AI image
        run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t ktc-ai:ci AI
      - name: Verify container health without calling Luna
        run: |
          container_id=$(docker run -d -p 127.0.0.1::8000 \
            -e LUNA_API_URL=http://luna.invalid -e LUNA_API_KEY=ci-only-not-a-secret ktc-ai:ci)
          trap 'docker rm -f "$container_id" >/dev/null' EXIT
          address=$(docker port "$container_id" 8000/tcp)
          curl --fail --silent --show-error --retry 15 --retry-all-errors \
            --retry-delay 2 --connect-timeout 2 --max-time 5 "http://$address/health" \
            | python3 -c 'import json,sys; body=json.load(sys.stdin); assert body.get("status")=="ok" and body.get("luna_configured") is True'
      - name: Upload AI test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-test-reports
          path: AI/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish AI image
    needs: [test, changes]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' && needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.release.outputs.image }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish AI
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: AI
          file: AI/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ai
          cache-to: type=gha,mode=max,scope=ai
      - name: Export immutable AI image reference
        id: release
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: printf 'image=%s@%s\n' "$IMAGE_NAME" "$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy AI through SSM
    needs: publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: ai-develop-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      deployments: write
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      AI_IMAGE: ${{ needs.publish.outputs.image }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check AI deployment configuration
        run: |
          : "${AWS_ROLE_ARN:?Set repository variable AWS_ROLE_ARN}"
          : "${AWS_REGION:?Set repository variable AWS_REGION}"
          : "${EC2_INSTANCE_ID:?Set repository variable EC2_INSTANCE_ID}"
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: ai-deploy-${{ github.run_id }}
      - name: Record AI deployment in progress
        id: start
        run: python3 infra/scripts/deployment-record.py start --service ai --commit "$GITHUB_SHA" --image "$AI_IMAGE"
      - name: Deploy AI and wait for remote verification
        id: remote
        run: |
          python3 infra/scripts/send-backend-deploy.py --service ai \
            --commit "$GITHUB_SHA" --image "$AI_IMAGE" \
            --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION"
      - name: Record AI deployment outcome
        if: always() && steps.start.outputs.deployment_id != ''
        env:
          DEPLOYMENT_ID: ${{ steps.start.outputs.deployment_id }}
          JOB_STATUS: ${{ job.status }}
          REMOTE_OUTCOME: ${{ steps.remote.outputs.outcome }}
        run: |
          python3 infra/scripts/deployment-record.py finish --service ai \
            --deployment-id "$DEPLOYMENT_ID" --job-status "$JOB_STATUS" --outcome "$REMOTE_OUTCOME"
