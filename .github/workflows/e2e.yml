name: E2E

# 핵심 흐름 브라우저 E2E (#482). 실제 프론트(빌드 번들) + 실제 백엔드(H2 메모리 DB)를 띄우고 Playwright 로 눌러 본다.
# 기동 · 종료는 frontend/playwright.config.ts 의 webServer 가 맡는다. AI 서버는 띄우지 않는다.
#
# ⭐ 배포 워크플로(frontend-ci · backend-ci-cd)와 따로 둔다.
#   - 배포 잡이 이 결과를 기다리지 않는다. E2E 가 흔들려도 develop 자동 배포를 막지 않고, 두 CI 시간도 그대로다.
#   - 화면과 API 의 연결을 보는 테스트라 프론트 · 백엔드 어느 쪽이 바뀌어도 돈다. frontend-ci 의 paths 는
#     deploy-frontend.sh 의 service_paths 와 짝이라 거기에 backend/** 를 넣을 수 없다(넣으면 백엔드 변경에도 프론트가
#     다시 배포된다). 그래서 워크플로를 나눴다.
#   - PR 에서만 돈다. develop 머지(배포) 때 공용 실행기를 더 쓰지 않는다.

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/e2e.yml'
      - '!frontend/**/*.md'
      - '!backend/**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # frontend-ci 와 같은 Node 메이저
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # backend-ci-cd 와 같은 JDK · Gradle 설정. 캐시는 읽기만 한다(백엔드 CI 의 캐시를 덮지 않게).
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: true

      - name: Install
        run: npm ci

      # e2e/ · playwright.config.ts 만 바뀐 PR 은 frontend-ci 가 돌지 않으므로 여기서 타입을 본다
      - name: Typecheck
        run: npm run typecheck

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npm run e2e

      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
