name: Backend CI/CD

on:
  # infra/도 포함한다. 배포가 서버의 compose.yaml·Caddyfile·배포 스크립트를 함께 반영한다.
  # AI 전용 배포 파일은 뺀다. 목록은 deploy-backend.sh의 service_paths와 같아야 한다(테스트가 검사).
  pull_request:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/backend-ci-cd.yml'
      - '!backend/**/*.md'
      - '!infra/**/*.md'
      - '!infra/scripts/deploy-ai.sh'
      - '!infra/scripts/verify-ai.py'
      - '!infra/scripts/tests/test_ai_deploy.py'
  push:
    branches: [develop]
    paths:
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/backend-ci-cd.yml'
      - '!backend/**/*.md'
      - '!infra/**/*.md'
      - '!infra/scripts/deploy-ai.sh'
      - '!infra/scripts/verify-ai.py'
      - '!infra/scripts/tests/test_ai_deploy.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/kakaotechcampus-4/ktc4-kyungpook-2-backend

jobs:
  test:
    name: Backend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Verify deployment scripts
        run: |
          bash -n infra/scripts/deploy-backend.sh
          python3 -m unittest discover -s infra/scripts/tests -p 'test_backend_deploy.py' -v
          python3 -m unittest discover -s infra/scripts/tests -p 'test_caddy_proxy.py' -v
        env:
          REQUIRE_DOCKER_TESTS: 'true'
          REQUIRE_FLOCK_TESTS: 'true'
      - name: Test and build backend
        working-directory: backend
        run: ./gradlew --no-daemon test integrationTest build
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/
            backend/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish backend image
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.release.outputs.image }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Export immutable image reference
        id: release
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: printf 'image=%s@%s\n' "$IMAGE_NAME" "$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy backend through SSM
    needs: publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' && vars.CADDY_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: backend-develop-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      BACKEND_IMAGE: ${{ needs.publish.outputs.image }}
      PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check deployment configuration
        run: |
          : "${AWS_ROLE_ARN:?Set repository variable AWS_ROLE_ARN}"
          : "${AWS_REGION:?Set repository variable AWS_REGION}"
          : "${EC2_INSTANCE_ID:?Set repository variable EC2_INSTANCE_ID}"
          : "${PUBLIC_ORIGIN:?Set repository variable PUBLIC_ORIGIN}"
          [[ "$PUBLIC_ORIGIN" == https://* ]] || { echo 'Production origin must use HTTPS'; exit 1; }
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: backend-deploy-${{ github.run_id }}
      - name: Deploy and wait for remote verification
        run: |
          python3 infra/scripts/send-deploy.py \
            --service backend \
            --commit "$GITHUB_SHA" \
            --image "$BACKEND_IMAGE" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --origin "$PUBLIC_ORIGIN"
      - name: Check public API
        run: |
          for attempt in {1..6}; do
            if python3 infra/scripts/verify-proxy.py health --origin "$PUBLIC_ORIGIN"; then
              exit 0
            fi
            sleep 2
          done
          exit 1
