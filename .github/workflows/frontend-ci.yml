name: Frontend CI/CD

# 프론트엔드에는 CI 가 없었고(#269 로 추가), CD 도 없어 develop 머지 뒤 사람이 SSM 으로
# 들어가 직접 다시 빌드해야 했다. #270 에서 **B안(GHCR 이미지 발행)** 으로 정했다.
#
# ⭐ 왜 서버 빌드가 아니라 이미지 발행인가.
#   EC2 가용 메모리가 3.7Gi 중 2.5Gi · Swap 0B 다 (10/30 실측). 서버에서 Vite 빌드를 돌리면
#   자동 배포가 OOM 으로 죽을 때 프론트가 내려간 채 남는다. CI 가 이미지를 만들어 올리면
#   서버 빌드 부하가 0 이 된다. BE·AI 와도 같은 모양이 된다.
#
# ⭐ 대신 `VITE_*` 의 진실의 원천이 서버 `infra/docker/.env` 에서 **GitHub repo variables** 로
#   옮겨간다. 번들에 박히는 값을 빌드하는 쪽이 CI 이기 때문이다. 서버 `.env` 의 같은 이름
#   값들은 이제 로컬 `compose build frontend` 에만 쓰인다.
#
# ⭐ `paths` 에 **이 파일 자신**과 배포 스크립트를 넣는다. 목록은 deploy-frontend.sh 의
#   service_paths 와 같아야 한다(테스트가 검사).

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'frontend/**'
      - 'infra/docker/compose.yaml'
      - 'infra/scripts/deploy-frontend.sh'
      - 'infra/scripts/send-deploy.py'
      - 'infra/scripts/tests/test_frontend_deploy.py'
      - '.github/workflows/frontend-ci.yml'
      - '!frontend/**/*.md'
  push:
    branches: [develop]
    paths:
      - 'frontend/**'
      - 'infra/docker/compose.yaml'
      - 'infra/scripts/deploy-frontend.sh'
      - 'infra/scripts/send-deploy.py'
      - 'infra/scripts/tests/test_frontend_deploy.py'
      - '.github/workflows/frontend-ci.yml'
      - '!frontend/**/*.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/kakaotechcampus-4/ktc4-kyungpook-2-frontend

jobs:
  check:
    name: Frontend typecheck and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # 배포 스크립트 검사는 저장소 루트에서 돌아야 해서 기본 작업 디렉터리를 잡에 둔다.
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # Dockerfile 의 `node:22-alpine` 과 같은 메이저로 고정한다.
      # CI 가 운영보다 새 Node 로 통과하면 여기서 못 잡고 빌드 이미지에서 터진다.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm install` 이 아니라 `npm ci` — 잠금 파일을 그대로 쓰고,
      # package.json 과 어긋나면 조용히 고치지 않고 실패한다.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify deployment scripts
        working-directory: .
        run: |
          bash -n infra/scripts/deploy-frontend.sh
          python3 -m unittest discover -s infra/scripts/tests -p 'test_frontend_deploy.py' -v
        env:
          REQUIRE_FLOCK_TESTS: 'true'

  # 핵심 흐름 브라우저 E2E (#482). 실제 프론트 + 실제 백엔드(H2 메모리 DB)를 띄우고 Playwright 로 눌러 본다.
  # 기동·종료는 playwright.config.ts 의 webServer 가 맡는다. AI 서버는 띄우지 않는다.
  #
  # ⭐ check 와 따로 둔다. publish 는 계속 check 만 기다린다 — E2E 가 흔들려도 develop 자동 배포를 막지 않고,
  #   check 시간도 그대로다. 대신 PR 에서만 돈다(develop push 마다 공용 실행기를 3~4분 더 쓰지 않게).
  # ⭐ 위 paths 는 frontend/ 기준이라 백엔드만 바뀐 PR 에서는 돌지 않는다. paths 는 deploy-frontend.sh 의
  #   service_paths 와 짝이라(테스트가 검사) backend/** 를 넣으면 백엔드 변경에도 프론트가 다시 배포된다. 넣지 않는다.
  e2e:
    name: Frontend E2E
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 백엔드 CI 와 같은 JDK · Gradle 설정. 캐시는 읽기만 한다(백엔드 CI 의 캐시를 덮지 않게).
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: true

      - name: Install
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npm run e2e

      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish frontend image
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.release.outputs.image }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # 프론트는 "false" 라는 **글자**만 실연동으로 읽는다 (auth.ts·api.ts 의 `!== "false"`).
      # 변수를 비워 두면 mock 이 켜진 채 운영에 나가고, 로그인 화면에
      # "mock 데이터로 둘러보기" 버튼이 그대로 보인다. 정확히 true/false 만 받는다.
      - name: Check build settings
        env:
          USE_MOCK: ${{ vars.USE_MOCK }}
          VITE_AUTH_MOCK: ${{ vars.VITE_AUTH_MOCK }}
        run: |
          status=0
          for name in USE_MOCK VITE_AUTH_MOCK; do
            value=${!name}
            case "$value" in
              true|false) echo "$name=$value" ;;
              *) echo "Set repository variable $name to exactly true or false (got '$value')" >&2; status=1 ;;
            esac
          done
          exit "$status"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          # VITE_* 는 여기서 번들에 박힌다. 서버 .env 가 아니라 이 값들이 운영에 나간다.
          # PUBLIC_API_BASE_URL 은 비워 두는 것이 정상이다 — Caddy 가 같은 오리진의
          # /api 를 backend 로 넘긴다. 별도 도메인으로 분리할 때만 채운다.
          build-args: |
            VITE_API_BASE_URL=${{ vars.PUBLIC_API_BASE_URL }}
            VITE_USE_MOCK=${{ vars.USE_MOCK }}
            VITE_AUTH_MOCK=${{ vars.VITE_AUTH_MOCK }}
          # 배포 스크립트가 revision으로 실행 중인 것보다 오래된 이미지를 거부한다.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # BE·AI 와 캐시가 섞이지 않게 scope를 나눈다.
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Export immutable image reference
        id: release
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: printf 'image=%s@%s\n' "$IMAGE_NAME" "$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy frontend through SSM
    needs: publish
    # CADDY_READY 게이트는 BE 와 같다. 운영 반영을 잠시 멈추려면 이 변수를 내린다 —
    # CD 가 생기면 develop 머지가 곧 운영 반영이라, 사람이 끼어들 손잡이를 남겨 둔다.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' && vars.CADDY_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: frontend-develop-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      FRONTEND_IMAGE: ${{ needs.publish.outputs.image }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check deployment configuration
        run: |
          : "${AWS_ROLE_ARN:?Set repository variable AWS_ROLE_ARN}"
          : "${AWS_REGION:?Set repository variable AWS_REGION}"
          : "${EC2_INSTANCE_ID:?Set repository variable EC2_INSTANCE_ID}"
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: frontend-deploy-${{ github.run_id }}
      - name: Deploy and wait for remote verification
        run: |
          python3 infra/scripts/send-deploy.py \
            --service frontend \
            --commit "$GITHUB_SHA" \
            --image "$FRONTEND_IMAGE" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"
